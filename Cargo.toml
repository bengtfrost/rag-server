[package]
name = "rag-server-mcp"
version = "2.4.0"
edition = "2024"
rust-version = "1.99"
description = "Sovereign, high-performance RAG MCP server written in Rust for local code and legal search."
license = "MIT"
repository = "https://github.com/bengtfrost/rag-server"
homepage = "https://github.com/bengtfrost/rag-server"

[package.metadata.docs.rs]
targets = []

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "load_extension"] }
reqwest = { version = "0.13", features = ["json", "stream", "native-tls"] }
tokenizers = { version = "0.23", default-features = false, features = [
  "fancy-regex",
] }
anyhow = "1"
regex = "1"
dirs = "7"
pdf-extract = "0.12"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# Optimizations
rayon = "1.10"
lazy_static = "1.5"
dashmap = "6.2"
once_cell = "1.19"
