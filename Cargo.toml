[package]
name = "rag-server-mcp"
version = "2.3.2"
edition = "2024"
description = "Sovereign, high-performance RAG MCP server written in Rust for local code and legal search."
license = "MIT"
repository = "https://github.com/bengtfrost/rag-server"
homepage = "https://github.com/bengtfrost/rag-server"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokenizers = "0.21.0"
anyhow = "1"
regex = "1"
dirs = "5"
pdf-extract = "0.6"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# Optimizations
rayon = "1.10"
lazy_static = "1.5"
dashmap = "6.1"
once_cell = "1.19"
