[package]
name = "rag-server-mcp"
version = "2.4.2"
edition = "2024"
rust-version = "1.100"
description = "Sovereign, high-performance RAG MCP server written in Rust for local code and legal search."
license = "MIT"
repository = "https://github.com/bengtfrost/rag-server"

[package.metadata.docs.rs]
targets = []

[dependencies]
# Trimmed from "full": process / io-std / parking_lot / test-util are unused.
# Add back individually if you later need them.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "fs",
  "io-util",
  "time",
  "signal",
  "sync",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "load_extension"] }
reqwest = { version = "0.13", features = ["json", "stream", "native-tls"] }
tokenizers = { version = "0.23", default-features = false, features = [
  "fancy-regex",
] }
anyhow = "1"
regex = "1"
dirs = "7"
pdf-extract = "0.12"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# Optimizations
rayon = "1.10"
dashmap = "6.2"

# Build third-party deps at -O2 even in dev builds. Tokenizers, pdf-extract and
# the TLS stack are excruciatingly slow at opt-level = 0; the local crate stays
# incremental for fast iteration.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
