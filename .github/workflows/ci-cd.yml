name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify builder base image exists
        run: |
          docker pull rust:1.100.0-slim-trixie >/dev/null
          echo "✓ rust:1.100.0-slim-trixie available"
      - name: Verify runtime base image exists
        run: |
          docker pull debian:trixie-slim >/dev/null
          echo "✓ debian:trixie-slim available"
      - name: Verify vec0.so download URLs
        run: |
          for arch in x86_64 aarch64; do
            url="https://github.com/asg017/sqlite-vec/releases/download/v0.1.9/sqlite-vec-0.1.9-loadable-linux-${arch}.tar.gz"
            if ! curl -fsSL --max-time 60 -o /dev/null "$url"; then
              echo "::error::Download failed: $url"
              exit 1
            fi
            echo "✓ ${arch} tarball reachable"
          done
      - name: Verify libssl3t64 exists in trixie
        run: |
          docker run --rm debian:trixie-slim sh -c '
            apt-get update >/dev/null 2>&1
            apt-cache show libssl3t64 >/dev/null 2>&1 || {
              echo "::error::libssl3t64 not found in trixie"; exit 1;
            }
            echo "✓ libssl3t64 available in trixie"
          '

  lint:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: |
          cargo clippy --all-targets --locked -- \
            -W clippy::pedantic -A clippy::module_name_repetitions -D warnings

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version from Cargo.toml
        id: get_version
        run: |
          version="$(awk -F'"' '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/          { in_pkg = 0 }
            in_pkg && /^version/ { print $2; exit }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          base="${REGISTRY}/${IMAGE_NAME}"
          list="${base}:sha-${{ github.sha }}"
          if [ "$IS_PR" != "true" ]; then
            list="${list},${base}:v${VERSION}"
            list="${list},${base}:latest"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Tags: $list"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: [build, lint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Read version from Cargo.toml
        id: get_version
        run: |
          version="$(awk -F'"' '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/          { in_pkg = 0 }
            in_pkg && /^version/ { print $2; exit }
          ' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (by sha — the just-pushed one)
        run: docker pull "${IMAGE}:sha-${{ github.sha }}"

      # -----------------------------------------------------------------------
      # DEFINITIVE diagnostic. Every introspection below goes through
      # `sh -c` (bypasses entrypoint) and captures exit codes explicitly,
      # so we can tell "binary missing / broken" apart from "binary runs
      # but prints nothing".
      # -----------------------------------------------------------------------
      - name: Diagnostic — image contents and binary behaviour
        run: |
          IMG="${IMAGE}:sha-${{ github.sha }}"
          echo "════════ 1. Image config ════════"
          docker inspect "$IMG" --format '
          Architecture: {{.Architecture}}
          OS:           {{.Os}}
          Entrypoint:   {{json .Config.Entrypoint}}
          Cmd:          {{json .Config.Cmd}}
          WorkingDir:   {{.Config.WorkingDir}}
          User:         {{.Config.User}}
          Env:          {{json .Config.Env}}
          Created:      {{.Created}}
          '

          echo "════════ 2. Image layers ════════"
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' "$IMG" | head -20

          echo "════════ 3. /usr/local/bin contents ════════"
          docker run --rm --entrypoint sh "$IMG" -c \
            'ls -la /usr/local/bin/ ; echo "---" ; file /usr/local/bin/rag-server-mcp || echo "file cmd missing"; echo "---"; stat /usr/local/bin/rag-server-mcp || echo "stat failed"'

          echo "════════ 4. Direct invocation via sh -c ════════"
          set +e
          docker run --rm --entrypoint sh "$IMG" -c '
            /usr/local/bin/rag-server-mcp --version
            echo "EXIT=$?"
          '
          echo "outer-exit=$?"
          set -e

          echo "════════ 5. Entrypoint invocation (normal docker run) ════════"
          set +e
          docker run --rm "$IMG" --version
          echo "docker run exit=$?"
          set -e

          echo "════════ 6. Capture stdout vs stderr separately ════════"
          set +e
          docker run --rm "$IMG" --version 1>/tmp/out 2>/tmp/err
          rc=$?
          echo "exit=$rc"
          echo "stdout bytes: $(wc -c < /tmp/out)"
          echo "stderr bytes: $(wc -c < /tmp/err)"
          echo "--- stdout (xxd) ---"; xxd /tmp/out | head -5
          echo "--- stderr (xxd) ---"; xxd /tmp/err | head -5
          set -e

          echo "════════ end diagnostic ════════"

      # Assertions below — if any fails, the diagnostic above shows why.
      - name: CLI — help produces output
        run: |
          set +e
          out=$(docker run --rm "${IMAGE}:sha-${{ github.sha }}" --help 2>&1)
          rc=$?
          set -e
          echo "exit=$rc, bytes=${#out}"
          if [ "$rc" -ne 0 ]; then
            echo "::error::--help exited $rc (binary missing or broken). See Diagnostic step."
            exit 1
          fi
          if [ -z "$out" ]; then
            echo "::error::--help exited 0 but produced no output. See Diagnostic step."
            exit 1
          fi
          echo "✓ --help produced ${#out} bytes"

      - name: CLI — version matches Cargo.toml
        run: |
          expected="${{ steps.get_version.outputs.version }}"
          set +e
          docker run --rm "${IMAGE}:sha-${{ github.sha }}" --version \
            > /tmp/version.out 2> /tmp/version.err
          rc=$?
          set -e
          echo "exit=$rc"
          echo "--- stdout ---"; cat /tmp/version.out
          echo "--- stderr ---"; cat /tmp/version.err
          combined=$(cat /tmp/version.out /tmp/version.err | tr -d '\r')
          actual=$(printf '%s' "$combined" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
          echo "Cargo.toml:  '$expected'"
          echo "Combined:    '$combined'"
          echo "Extracted:   '$actual'"
          if [ "$actual" != "$expected" ]; then
            echo "::error::version mismatch (exit=$rc). Cargo.toml='$expected', image='$combined'. See Diagnostic step 4/5/6."
            exit 1
          fi

      - name: Runtime — resources resolve and vec0 loads
        run: |
          set +e
          docker run --rm \
            -e RUST_LOG=info \
            -e RAG_DB_PATH=/tmp/smoke.db \
            "${IMAGE}:sha-${{ github.sha }}" \
            list-collections > /tmp/smoke.log 2>&1
          code=$?
          set -e
          cat /tmp/smoke.log
          if [ "$code" -ne 0 ]; then
            echo "::error::list-collections exited $code — image is missing resources"
            exit 1
          fi
          grep -q "resolved resource paths" /tmp/smoke.log || {
            echo "::error::startup log missing 'resolved resource paths'"
            exit 1
          }
          if grep -qi "vec0 extension not found" /tmp/smoke.log; then
            echo "::error::vec0 extension not found in image"
            exit 1
          fi

      - name: Verify :latest points at the sha image
        run: |
          docker pull "${IMAGE}:latest"
          sha_digest=$(docker inspect "${IMAGE}:sha-${{ github.sha }}" \
            --format '{{index .RepoDigests 0}}' | awk -F@ '{print $2}')
          latest_digest=$(docker inspect "${IMAGE}:latest" \
            --format '{{index .RepoDigests 0}}' | awk -F@ '{print $2}')
          echo "sha digest:    $sha_digest"
          echo "latest digest: $latest_digest"
          if [ "$sha_digest" != "$latest_digest" ]; then
            echo "::error::${IMAGE}:latest does not point at sha image"
            exit 1
          fi
