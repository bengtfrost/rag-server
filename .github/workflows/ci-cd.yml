name: CI/CD Pipeline for RAG Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

env:
  REGISTRY: ghcr.io # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }} # e.g., "bengtfrost/rag-server"
  RAG_SERVER_DIR: /usr/local/lib/rag-server # Directory for RAG Server files in the container

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust and dependencies
        run: |
          dnf install -y \
            rust \
            cargo \
            sqlite-devel \
            poppler-utils \
            && dnf clean all

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build project
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-server-binary
          path: target/release/rag-server

  containerize:
    name: Build and Push Container
    needs: build-and-test # Ensure tests pass before containerizing
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: rag-server-binary
          path: target/release

      - name: Install Podman
        run: dnf install -y podman

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build container image
        run: |
          podman build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push container image
        run: |
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  test-container:
    name: Test Container
    needs: containerize # Ensure container is built before testing
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install Podman
        run: dnf install -y podman

      - name: Pull container image
        run: |
          podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Test CLI command (help)
        run: |
          podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --help

      - name: Test CLI command (query)
        run: |
          podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest query --help

      - name: Test CLI command (ingest-file)
        run: |
          podman run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ingest-file --help
